<style>
/* Layout: one full-screen pond seen from above, a quiet HUD floating at the corners. Single dusk look, both themes. */
:root {
  --ground: #1f2b22;
  --ink: #f3ead6;
  --ink-dim: rgba(243, 234, 214, 0.62);
  --bronze: #d9a441;
  --glass: rgba(14, 30, 30, 0.42);
  --f-display: "ZCOOL XiaoWei", "STKaiti", "KaiTi", "Songti SC", serif;

}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#pond { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; outline: none; }
.hud {
  position: fixed; left: 0; right: 0; top: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));

}
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 4.4vw, 40px); letter-spacing: 0.12em; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
.brand p { margin: 2px 0 0; font-size: 13px; color: var(--ink-dim); letter-spacing: 0.06em; }
.side { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
.count {
  display: flex; align-items: baseline; gap: 4px;
  background: var(--glass); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);

  font-variant-numeric: tabular-nums;
}
.count .label { font-size: 12px; color: var(--ink-dim); margin-right: 2px; }

}
#wishesBtn:focus-visible, #pond:focus-visible, .wish button:focus-visible, .wish input:focus-visible, .drawer button:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
.hint {

  border-radius: 999px; padding: 8px 16px; pointer-events: none; text-align: center;

}

  background: rgba(10, 24, 26, 0.72); color: var(--ink); font-size: 14px; letter-spacing: .06em;

  background: rgba(12, 28, 30, 0.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(217, 164, 65, 0.4); border-radius: 18px; padding: 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
}
.wish label { font-family: var(--f-display); font-size: 20px; letter-spacing: .1em; color: var(--bronze); }

}

}
.wish .meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-dim); }

  border-left: 1px solid rgba(243,234,214,0.12);
  padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));

}
.drawer header { display: flex; justify-content: space-between; align-items: center; }
.drawer h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; letter-spacing: .1em; }
.drawer ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

.drawer .empty { color: var(--ink-dim); line-height: 1.7; }
@media (max-width: 520px) { .brand p { display: none; } }

<script>
(() => {
  const cv = document.getElementById('pond');
  let ctx = cv.getContext('2d');
  const nEl = document.getElementById('n');
  const hint = document.getElementById('hint');
  const hitsEl = document.getElementById('hits');
  const toastEl = document.getElementById('toast');
  const wishForm = document.getElementById('wish');
  const wishInput = document.getElementById('wishText');
  const wishLen = document.getElementById('wishLen');
  const wishesBtn = document.getElementById('wishesBtn');
  const wishesEl = document.getElementById('wishes');
  const wishList = document.getElementById('wishList');

  const rnd = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;
  const wrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

  let W = 0, H = 0, DPR = 1, S = 1;
  // pond geometry is in world units; the water layer is drawn with a vertical squash (view.T) for a 3/4 view
  const pond = { cx: 0, cy: 0, rx: 1, ry: 1 };
  const view = { T: 0.6, top: 0, sc: 1, rim: 14, path: 24, wallH: 8 };
  const toScreen = (x, y) => [x, pond.cy + (y - pond.cy) * view.T];
  const toWorldY = sy => pond.cy + (sy - pond.cy) / view.T;
  let pebbles = [], lilies = [], koi = [], coins = [], flying = [], ripples = [], drops = [], glows = [];
  let lanterns = [], floats = [];
  const bowl = { x: 0, y: 0, R: 1 };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('wishpond.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('wishpond.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  let count = parseInt(store.get('count', 0), 10) || 0;
  let hits = parseInt(store.get('hits', 0), 10) || 0;
  nEl.textContent = count;
  hitsEl.textContent = hits;

  /* ---------- geometry ---------- */
  function inWater(x, y, pad = 0) {
    const a = (x - pond.cx) / Math.max(1, pond.rx - pad), b = (y - pond.cy) / Math.max(1, pond.ry - pad);
    return a * a + b * b < 1;
  }
  function clampWater(x, y, pad = 0) {
    if (inWater(x, y, pad)) return [x, y];
    const dx = x - pond.cx, dy = y - pond.cy;
    const a = Math.atan2(dy / (pond.ry - pad), dx / (pond.rx - pad));
    return [pond.cx + Math.cos(a) * (pond.rx - pad) * 0.98, pond.cy + Math.sin(a) * (pond.ry - pad) * 0.98];
  }
  function randWater(pad) {
    const a = rnd(0, TAU), r = Math.sqrt(Math.random()) * 0.95;
    return [pond.cx + Math.cos(a) * (pond.rx - pad) * r, pond.cy + Math.sin(a) * (pond.ry - pad) * r];
  }

  /* ---------- scenery (art direction: sunlit forest ruins, see docs/PRD.md) ---------- */
  let seed = 7;
  const srnd = (a, b) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
  let bgC = null, rimC = null, fgC = null, beams = [], motes = [], glints = [], blossoms = [];
  const fall = { x: 0, w: 0, y1: 0, y2: 0, t: 0 };
  function offscreen() {
    const c = document.createElement('canvas');
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    return [c, g];
  }
  // screen-space ellipses of the pond and its surroundings
  function rings() {
    const sry = pond.ry * view.T, cy = pond.cy, wh = view.wallH;
    return {
      water: [pond.cx, cy, pond.rx, sry],
      basin: [pond.cx, cy - wh, pond.rx, sry],
      coping: [pond.cx, cy - wh / 2, pond.rx + view.rim, sry + view.rim * 0.8 + wh / 2],
      path: [pond.cx, cy - wh / 2, pond.rx + view.rim + view.path, sry + (view.rim + view.path) * 0.8 + wh / 2],
    };
  }
  const ell = (g, e) => { g.beginPath(); g.ellipse(e[0], e[1], e[2], e[3], 0, 0, TAU); };
  // depth of field: re-draw a band of an offscreen canvas blurred (skipped where canvas filters are missing)
  function blurBand(g, c, y0, y1, px) {
    if (!('filter' in g) || px <= 0) return;
    const t = document.createElement('canvas'); t.width = c.width; t.height = c.height;
    t.getContext('2d').drawImage(c, 0, 0);
    g.save(); g.beginPath(); g.rect(0, y0, W, y1 - y0); g.clip();
    g.filter = `blur(${px}px)`; g.drawImage(t, 0, 0, W, H); g.restore();
  }
  let grainC = null;
  function grain(g, a, op = 'source-over') {
    if (!grainC) {
      grainC = document.createElement('canvas'); grainC.width = grainC.height = 160;
      const gg = grainC.getContext('2d'), im = gg.createImageData(160, 160), d = im.data;
      for (let i = 0; i < d.length; i += 4) { const v = Math.random() < 0.5 ? 0 : 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = Math.random() * 255; }
      gg.putImageData(im, 0, 0);
    }
    g.save(); g.globalAlpha = a; g.globalCompositeOperation = op;
    g.fillStyle = g.createPattern(grainC, 'repeat'); g.fillRect(0, 0, W, H); g.restore();
  }

  function paintBackground() {
    const [c, g] = offscreen();
    const top = view.top, sc = view.sc, R = rings();
    const wt = top * 0.36;
    // canopy haze
    let gr = g.createLinearGradient(0, 0, 0, top);
    gr.addColorStop(0, '#f3f8d2'); gr.addColorStop(0.3, '#bcdc7a'); gr.addColorStop(1, '#355a2a');
    g.fillStyle = gr; g.fillRect(0, 0, W, top + 2);
    for (let i = 0; i < 9; i++) {
      g.fillStyle = 'rgba(58,66,44,0.4)';
      const x = srnd(0, W), w = srnd(5, 15) * sc;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x + w, 0); g.lineTo(x + w * 1.4, wt + 10); g.lineTo(x - w * 0.4, wt + 10); g.fill();
    }
    const layers = [['#b3d86a', '#e2f29c', 0.55], ['#6ea23e', '#a6d258', 0.42], ['#2e5926', '#4f8c33', 0.3]];
    for (const [base, hi, yMax] of layers) {
      const n = Math.ceil(W / 22);
      for (let i = 0; i < n; i++) {
        const x = srnd(-40, W + 40), y = srnd(-40, top * yMax), r = srnd(26, 64) * sc;
        g.globalAlpha = 0.85; g.fillStyle = base; g.beginPath(); g.arc(x, y, r * 0.8, 0, TAU); g.fill();
        g.globalAlpha = 0.8;
        for (let k = 0; k < 18; k++) {
          const a = srnd(0, TAU), d = Math.sqrt(srnd(0, 1)) * r, lr = srnd(0.1, 0.2) * r;
          g.fillStyle = srnd(0, 1) < 0.5 - Math.sin(a) * 0.3 ? hi : base;
          g.beginPath(); g.ellipse(x + Math.cos(a) * d, y + Math.sin(a) * d, lr, lr * 0.55, srnd(0, TAU), 0, TAU); g.fill();
        }
        g.globalAlpha = 1;
      }
    }
    blurBand(g, c, 0, wt + 30 * sc, 3.2 * sc);
    // mossy ruin wall
    gr = g.createLinearGradient(0, wt, 0, top);
    gr.addColorStop(0, '#838c74'); gr.addColorStop(1, '#434b3c');
    g.fillStyle = gr; g.fillRect(0, wt, W, top - wt);
    const bh = 24 * sc;
    for (let y = wt, r = 0; y < top; y += bh, r++) {
      for (let x = -srnd(0, 40) * sc; x < W; ) {
        const bw = srnd(38, 74) * sc, v = srnd(-16, 16);
        g.fillStyle = `rgba(${128 + v},${136 + v},${114 + v},0.55)`;
        g.fillRect(x + 1, y + 1, bw - 2, bh - 2);
        g.strokeStyle = 'rgba(28,34,24,0.35)'; g.lineWidth = 1;
        g.strokeRect(x + 0.5, y + 0.5, bw - 1, bh - 1);
        x += bw;
      }
    }
    for (let i = 0; i < W / 9; i++) {
      const y = srnd(0, 1) < 0.6 ? srnd(wt, wt + (top - wt) * 0.35) : srnd(top - (top - wt) * 0.3, top);
      g.fillStyle = srnd(0, 1) < 0.5 ? 'rgba(122,166,58,0.35)' : 'rgba(170,210,85,0.25)';
      g.beginPath(); g.ellipse(srnd(0, W), y, srnd(10, 34) * sc, srnd(4, 12) * sc, 0, 0, TAU); g.fill();
    }
    // arch in the middle, lit from beyond, with water spilling out of it
    const aw = Math.max(70, Math.min(150, W * 0.13)), ah = (top - wt) * 0.86, ax = pond.cx;
    const archPath = () => {
      g.beginPath();
      g.moveTo(ax - aw / 2, top);
      g.lineTo(ax - aw / 2, top - ah + aw / 2);
      g.arc(ax, top - ah + aw / 2, aw / 2, Math.PI, 0);
      g.lineTo(ax + aw / 2, top);
      g.closePath();
    };
    g.save(); g.strokeStyle = '#a3ab90'; g.lineWidth = 16 * sc; archPath(); g.stroke(); g.restore();
    g.strokeStyle = 'rgba(40,46,34,0.4)'; g.lineWidth = 1;
    for (let i = 0; i <= 8; i++) {
      const a = Math.PI + i / 8 * Math.PI, cx0 = ax, cy0 = top - ah + aw / 2;
      g.beginPath(); g.moveTo(cx0 + Math.cos(a) * (aw / 2), cy0 + Math.sin(a) * (aw / 2));
      g.lineTo(cx0 + Math.cos(a) * (aw / 2 + 8 * sc), cy0 + Math.sin(a) * (aw / 2 + 8 * sc)); g.stroke();
    }
    gr = g.createLinearGradient(0, top - ah, 0, top);
    gr.addColorStop(0, '#f6f9cf'); gr.addColorStop(0.55, '#c3df7f'); gr.addColorStop(1, '#6e9b44');
    g.fillStyle = gr; archPath(); g.fill();
    g.fillStyle = 'rgba(90,130,50,0.5)';
    for (let i = 0; i < 10; i++) { g.beginPath(); g.ellipse(ax + srnd(-aw * 0.45, aw * 0.45), top - srnd(4, ah * 0.35), srnd(5, 14) * sc, srnd(3, 6) * sc, 0, 0, TAU); g.fill(); }
    // ivy curtains, lime in the light and deep green in the shade
    const ivy = ['#2c5626', '#3f7530', '#5f9a36', '#93c64a', '#b9de62'];
    const strands = Math.ceil(W / 7);
    for (let i = 0; i < strands; i++) {
      const x0 = srnd(0, W), len = srnd(0.15, 0.9) * (top - wt + 20 * sc), ph = srnd(0, TAU);
      if (Math.abs(x0 - ax) < aw * 0.45 && srnd(0, 1) < 0.7) continue;
      for (let t = 0; t < len; t += 4 * sc) {
        if (srnd(0, 1) < t / len * 0.6) continue;
        g.fillStyle = ivy[Math.floor(srnd(0, 5))];
        g.beginPath();
        g.ellipse(x0 + Math.sin(t * 0.04 + ph) * 5 * sc + srnd(-4, 4) * sc, wt - 14 * sc + t, srnd(3, 7) * sc, srnd(2, 4.5) * sc, srnd(0, TAU), 0, TAU);
        g.fill();
      }
    }
    blurBand(g, c, 0, top, 1.3 * sc);
    gr = g.createLinearGradient(0, 0, 0, top);
    gr.addColorStop(0, 'rgba(236,246,206,0.32)'); gr.addColorStop(0.6, 'rgba(220,236,190,0.14)'); gr.addColorStop(1, 'rgba(220,236,190,0.05)');
    g.fillStyle = gr; g.fillRect(0, 0, W, top);
    g.save(); g.globalCompositeOperation = 'screen';
    for (let i = 0; i < 46; i++) {
      const x = srnd(0, W), y = srnd(0, wt + 20 * sc), r = srnd(4, 16) * sc;
      const bg = g.createRadialGradient(x, y, 0, x, y, r);
      bg.addColorStop(0, 'rgba(255,255,215,0.3)'); bg.addColorStop(0.7, 'rgba(255,255,215,0.18)'); bg.addColorStop(1, 'rgba(255,255,215,0)');
      g.fillStyle = bg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    }
    g.restore();
    // lawn
    gr = g.createLinearGradient(0, top, 0, H);
    gr.addColorStop(0, '#6c9a3a'); gr.addColorStop(1, '#2f5222');
    g.fillStyle = gr; g.fillRect(0, top, W, H - top);
    gr = g.createLinearGradient(0, top, 0, top + 26 * sc);
    gr.addColorStop(0, 'rgba(15,30,10,0.45)'); gr.addColorStop(1, 'rgba(15,30,10,0)');
    g.fillStyle = gr; g.fillRect(0, top, W, 26 * sc);
    g.lineWidth = 0.8;
    for (let i = 0; i < W * H / 260; i++) {
      const x = srnd(0, W), y = srnd(top, H), f = (y - top) / (H - top);
      g.strokeStyle = srnd(0, 1) < 0.5 ? `rgba(190,228,110,${0.15 + f * 0.25})` : `rgba(22,50,16,${0.2 + f * 0.25})`;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + srnd(-2, 2), y - srnd(2, 4 + f * 6) * sc); g.stroke();
    }
    g.lineWidth = 1;
    g.save(); g.globalCompositeOperation = 'screen';
    for (let i = 0; i < 14; i++) {
      const x = srnd(0, W), y = srnd(top, H), r = srnd(30, 90) * sc;
      g.save(); g.translate(x, y); g.scale(1, 0.45);
      const sg = g.createRadialGradient(0, 0, 0, 0, 0, r);
      sg.addColorStop(0, 'rgba(230,240,150,0.22)'); sg.addColorStop(1, 'rgba(230,240,150,0)');
      g.fillStyle = sg; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); g.restore();
    }
    g.restore();
    grain(g, 0.05);
    {
      const e = R.path;
      g.save(); g.translate(e[0], e[1] + 6 * sc); g.scale(1, (e[3] + 18 * sc) / (e[2] + 24 * sc));
      const sg = g.createRadialGradient(0, 0, (e[2] + 24 * sc) * 0.8, 0, 0, e[2] + 24 * sc);
      sg.addColorStop(0, 'rgba(10,24,8,0.4)'); sg.addColorStop(1, 'rgba(10,24,8,0)');
      g.fillStyle = sg; g.beginPath(); g.arc(0, 0, e[2] + 24 * sc, 0, TAU); g.fill(); g.restore();
    }
    for (let i = 0; i < W * H / 6000; i++) {
      g.fillStyle = srnd(0, 1) < 0.6 ? 'rgba(250,250,240,0.8)' : 'rgba(170,200,250,0.75)';
      g.beginPath(); g.arc(srnd(0, W), srnd(top + 6, H), srnd(0.8, 1.8) * sc, 0, TAU); g.fill();
    }
    // broken columns standing in the grass
    for (const fx of [0.07, 0.17, 0.83, 0.93]) {
      const x = W * fx + srnd(-10, 10), cw = 20 * sc, chh = (top - wt) * srnd(0.5, 1.05), by = top + srnd(8, 22) * sc;
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(x + 6 * sc, by, cw, cw * 0.3, 0, 0, TAU); g.fill();
      gr = g.createLinearGradient(x - cw / 2, 0, x + cw / 2, 0);
      gr.addColorStop(0, '#c5c4a6'); gr.addColorStop(1, '#6f7562');
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(x - cw / 2, by); g.lineTo(x - cw / 2, by - chh);
      g.lineTo(x - cw * 0.15, by - chh - srnd(4, 12) * sc); g.lineTo(x + cw * 0.1, by - chh + srnd(0, 6) * sc);
      g.lineTo(x + cw / 2, by - chh - srnd(2, 8) * sc); g.lineTo(x + cw / 2, by); g.closePath(); g.fill();
      g.fillStyle = '#d2d0b3'; g.fillRect(x - cw * 0.7, by - 7 * sc, cw * 1.4, 7 * sc);
      g.fillStyle = 'rgba(130,175,60,0.6)';
      for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(x + srnd(-cw / 2, cw / 2), by - srnd(0, chh), srnd(3, 7) * sc, srnd(2, 4) * sc, 0, 0, TAU); g.fill(); }
    }
    // mossy steps carrying the water from the arch down to the pond
    const wTop = pond.cy - pond.ry * view.T - view.wallH;
    fall.x = ax; fall.w = aw * 0.42; fall.y1 = top - 2; fall.y2 = wTop + 6 * sc;
    const sw = aw * 0.95, steps = Math.max(2, Math.round((wTop - top) / (14 * sc)));
    for (let i = 0; i < steps; i++) {
      const y0 = top + (wTop - top) * i / steps, y1 = top + (wTop - top) * (i + 1) / steps + 2;
      g.fillStyle = i % 2 ? '#6c7560' : '#7d866f';
      g.fillRect(ax - sw / 2 - i * 2 * sc, y0, sw + i * 4 * sc, y1 - y0);
      g.fillStyle = 'rgba(140,185,70,0.55)';
      g.fillRect(ax - sw / 2 - i * 2 * sc, y0, sw + i * 4 * sc, 3 * sc);
    }
    // basin wall
    ell(g, R.basin);
    gr = g.createLinearGradient(0, R.basin[1] - R.basin[3], 0, R.basin[1]);
    gr.addColorStop(0, '#3a4630'); gr.addColorStop(1, '#16261a');
    g.fillStyle = gr; g.fill();
    return c;
  }

  function paintRim() {
    const [c, g] = offscreen();
    const R = rings(), sc = view.sc, e = R.water;
    const n = Math.round(Math.PI * (e[2] + e[3]) / (20 * sc));
    const stones = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + srnd(-0.03, 0.03);
      const x = e[0] + Math.cos(a) * (e[2] + srnd(0, 7) * sc), y = e[1] + Math.sin(a) * (e[3] + srnd(0, 5) * sc) - view.wallH * (Math.sin(a) < 0 ? 1 : 0.2);
      if (Math.sin(a) < 0 && Math.abs(x - fall.x) < fall.w * 0.7) continue;
      const w = srnd(13, 26) * sc;
      stones.push({ x, y, w, h: w * srnd(0.5, 0.72), rot: srnd(-0.3, 0.3) });
    }
    stones.sort((p, q) => p.y - q.y);
    for (const st of stones) {
      g.save(); g.translate(st.x, st.y); g.rotate(st.rot);
      g.fillStyle = 'rgba(5,20,8,0.35)';
      g.beginPath(); g.ellipse(3 * sc, 4 * sc, st.w * 0.55, st.h * 0.55, 0, 0, TAU); g.fill();
      const v = srnd(-14, 14);
      const gr = g.createRadialGradient(-st.w * 0.2, -st.h * 0.3, st.w * 0.04, 0, 0, st.w * 0.62);
      gr.addColorStop(0, `rgb(${200 + v},${198 + v},${176 + v})`); gr.addColorStop(0.45, `rgb(${134 + v},${136 + v},${116 + v})`); gr.addColorStop(1, `rgb(${50 + v},${55 + v},${44 + v})`);
      g.fillStyle = gr;
      g.beginPath(); g.ellipse(0, 0, st.w * 0.55, st.h * 0.55, 0, 0, TAU); g.fill();
      const wg = g.createLinearGradient(0, 0, 0, st.h * 0.55);
      wg.addColorStop(0, 'rgba(20,32,22,0)'); wg.addColorStop(1, 'rgba(20,32,22,0.45)');
      g.fillStyle = wg; g.fill();
      const mg = g.createRadialGradient(-st.w * 0.08, -st.h * 0.28, 0, -st.w * 0.08, -st.h * 0.2, st.w * 0.45);
      const mc = srnd(0, 1) < 0.5 ? '128,168,62' : '100,140,50';
      mg.addColorStop(0, `rgba(${mc},0.85)`); mg.addColorStop(0.65, `rgba(${mc},0.5)`); mg.addColorStop(1, `rgba(${mc},0)`);
      g.fillStyle = mg;
      g.beginPath(); g.ellipse(-st.w * 0.08, -st.h * 0.22, st.w * 0.45, st.h * 0.34, 0, 0, TAU); g.fill();
      g.restore();
      if (srnd(0, 1) < 0.45) {
        g.strokeStyle = 'rgba(160,210,80,0.85)'; g.lineWidth = 1;
        for (let k = 0; k < 5; k++) { const gx = st.x + srnd(-st.w / 2, st.w / 2); g.beginPath(); g.moveTo(gx, st.y - st.h * 0.2); g.lineTo(gx + srnd(-3, 3) * sc, st.y - st.h * 0.2 - srnd(5, 11) * sc); g.stroke(); }
      }
      if (srnd(0, 1) < 0.25) {
        g.fillStyle = 'rgba(255,255,248,0.95)';
        g.beginPath(); g.arc(st.x + srnd(-6, 6) * sc, st.y - st.h * 0.35, 1.6 * sc, 0, TAU); g.fill();
      }
    }
    grain(g, 0.05, 'source-atop');
    return c;
  }

  function paintForeground() {
    const [c, g] = offscreen();
    const sc = view.sc;
    const rock = (x0, dir) => {
      const w = Math.max(90, W * 0.2), h = Math.max(70, H * 0.15);
      g.save(); g.translate(x0, H); g.scale(dir, 1);
      const gr = g.createLinearGradient(0, -h, 0, 0);
      gr.addColorStop(0, '#4b5240'); gr.addColorStop(1, '#1b2018');
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(-10, 10); g.lineTo(-10, -h * 0.8);
      g.quadraticCurveTo(w * 0.2, -h * 1.1, w * 0.45, -h * 0.75);
      g.quadraticCurveTo(w * 0.7, -h * 0.55, w * 0.8, -h * 0.25);
      g.quadraticCurveTo(w * 0.95, -h * 0.05, w, 10); g.closePath(); g.fill();
      g.fillStyle = 'rgba(100,150,60,0.55)';
      for (let i = 0; i < 14; i++) { g.beginPath(); g.ellipse(srnd(0, w * 0.6), -h * srnd(0.55, 0.9), srnd(8, 20) * sc, srnd(3, 7) * sc, srnd(-0.4, 0.4), 0, TAU); g.fill(); }
      // ferns
      for (let f = 0; f < 4; f++) {
        const bx = srnd(w * 0.05, w * 0.5), by = -h * srnd(0.6, 0.85), len = srnd(50, 90) * sc, ang = srnd(-2.4, -1.2);
        g.strokeStyle = '#2f5a26'; g.lineWidth = 1.5 * sc;
        g.beginPath(); g.moveTo(bx, by);
        const ex = bx + Math.cos(ang) * len, ey = by + Math.sin(ang) * len;
        g.quadraticCurveTo(bx + Math.cos(ang + 0.5) * len * 0.6, by + Math.sin(ang + 0.5) * len * 0.6, ex, ey); g.stroke();
        for (let t = 0.15; t < 1; t += 0.09) {
          const px = bx + (ex - bx) * t, py = by + (ey - by) * t, l = (1 - t) * 14 * sc + 3 * sc;
          g.fillStyle = t < 0.5 ? '#3f7a31' : '#5c9a42';
          for (const sd of [-1, 1]) { g.beginPath(); g.ellipse(px + Math.cos(ang + sd * 1.3) * l * 0.5, py + Math.sin(ang + sd * 1.3) * l * 0.5, l * 0.5, l * 0.16, ang + sd * 1.3, 0, TAU); g.fill(); }
        }
      }
      g.restore();
    };
    rock(0, 1); rock(W, -1);
    blurBand(g, c, 0, H, 2.6 * sc);
    let gr = g.createRadialGradient(W / 2, H * 0.58, Math.min(W, H) * 0.42, W / 2, H * 0.58, Math.max(W, H) * 0.85);
    gr.addColorStop(0, 'rgba(6,16,8,0)'); gr.addColorStop(1, 'rgba(6,16,8,0.55)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    gr = g.createLinearGradient(0, 0, 0, 110);
    gr.addColorStop(0, 'rgba(12,28,14,0.55)'); gr.addColorStop(1, 'rgba(12,28,14,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, 110);
    grain(g, 0.035);
    return c;
  }

  function buildScenery() {
    seed = 7;
    pebbles = [];
    for (let i = 0; i < 34; i++) {
      const [x, y] = randWater(10);
      pebbles.push({ x, y, r: rnd(12, 36) * S, rot: rnd(0, TAU), c: '20,58,32', a: 0.38, moss: true });
    }
    for (let i = 0; i < 70; i++) {
      const [x, y] = randWater(10);
      pebbles.push({ x, y, r: rnd(2, 6) * S, rot: rnd(0, TAU), c: Math.random() < 0.5 ? '205,215,170' : '60,95,55', a: 0.25 });
    }
    bgC = paintBackground(); rimC = paintRim(); fgC = paintForeground();
    beams = [];
    for (let i = 0; i < 5; i++) beams.push({ ang: 0.7 + i * 0.13 + srnd(-0.04, 0.04), w: srnd(40, 110) * view.sc, a: srnd(0.08, 0.16), ph: srnd(0, TAU) });
    motes = [];
    for (let i = 0; i < 40; i++) motes.push({ x: srnd(0, W), y: srnd(0, H), vx: srnd(-6, 6), vy: srnd(-4, 5), ph: srnd(0, TAU), r: srnd(0.8, 2) });
    glints = [];
    for (let i = 0; i < 60; i++) { const [x, y] = randWater(20); glints.push({ x, y, ph: srnd(0, TAU), sp: srnd(0.8, 2) }); }
    causticsSetup();
  }

  // small white flowers floating on the surface
  function makeBlossoms() {
    blossoms = [];
    for (let i = 0; i < 26; i++) {
      const [x, y] = randWater(20 * S);
      blossoms.push({ x, y, vx: 0, vy: 0, rot: rnd(0, TAU), ph: rnd(0, TAU), r: rnd(3.5, 6.5) * S });
    }
  }
  function pushBlossoms(x, y, force) {
    for (const b of blossoms) {
      const dx = b.x - x, dy = b.y - y, d = Math.hypot(dx, dy);
      if (d > 140 * S || d < 0.1) continue;
      const k = force * (1 - d / (140 * S));
      b.vx += dx / d * k; b.vy += dy / d * k;
    }
  }
  function drawBlossoms(dt) {
    for (const b of blossoms) {
      b.vx *= Math.pow(0.35, dt); b.vy *= Math.pow(0.35, dt);
      b.x += (b.vx + Math.sin(tNow * 0.2 + b.ph) * 2 * S) * dt;
      b.y += (b.vy + Math.cos(tNow * 0.17 + b.ph) * 1.5 * S) * dt;
      if (!inWater(b.x, b.y, 14 * S)) { b.vx += (pond.cx - b.x) * 0.02; b.vy += (pond.cy - b.y) * 0.02; }
      b.rot += b.vx * 0.002;
      const [x, y0] = toScreen(b.x, b.y), r = b.r, T = view.T, y = y0 + waveAt(b.x, b.y) * 1.6 * S;
      ctx.fillStyle = 'rgba(5,30,15,0.25)';
      ctx.beginPath(); ctx.ellipse(x + 3 * S, y + 6 * S, r, r * T, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fbfbf4';
      for (let k = 0; k < 5; k++) {
        const a = b.rot + k / 5 * TAU;
        ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55 * T, r * 0.55, r * 0.32, a, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = '#f2c94c';
      ctx.beginPath(); ctx.arc(x, y, r * 0.25, 0, TAU); ctx.fill();
    }
  }

  function makeLilies() {
    lilies = [];
    const clusters = 4, per = Math.round(4 + pond.rx / 90);
    for (let c = 0; c < clusters; c++) {
      const a = c / clusters * TAU + rnd(-0.4, 0.4) + 0.4, rr = rnd(0.6, 0.85);
      const cx = pond.cx + Math.cos(a) * pond.rx * rr, cy = pond.cy + Math.sin(a) * pond.ry * rr;
      for (let i = 0; i < per; i++) {
        const [x, y] = clampWater(cx + rnd(-60, 60) * S, cy + rnd(-45, 45) * S, 18 * S);
        if (Math.hypot(x - bowl.x, y - bowl.y) < bowl.R * 1.8) continue;
        lilies.push({ x, y, r: rnd(12, 26) * S, rot: rnd(0, TAU), ph: rnd(0, TAU), flower: Math.random() < 0.28, tone: Math.random() });
      }
    }
  }

  /* ---------- koi ---------- */
  const KINDS = [
    { name: 'kohaku', base: '#f5efe3', fin: 'rgba(245,239,227,0.55)', patches: ['#d6402a'] },
    { name: 'kohaku', base: '#f7f1e6', fin: 'rgba(247,241,230,0.55)', patches: ['#e0522c'] },
    { name: 'ogon', base: '#ef8a2c', fin: 'rgba(245,160,70,0.55)', patches: ['#f7b356'] },
    { name: 'showa', base: '#1c1b1d', fin: 'rgba(40,40,44,0.6)', patches: ['#d5442c', '#f1eadc'] },
    { name: 'shiro', base: '#f1ece2', fin: 'rgba(241,236,226,0.5)', patches: ['#22211f'] },
    { name: 'ogon', base: '#e9b13d', fin: 'rgba(240,195,90,0.55)', patches: ['#f6d77a'] },
  ];

  function makeKoi(kind) {
    const len = rnd(78, 104) * S;
    const segs = 14;
    const [x, y] = randWater(60 * S);
    const heading = rnd(0, TAU);
    const pts = [];
    for (let i = 0; i < segs; i++) pts.push({ x: x - Math.cos(heading) * i * len / segs, y: y - Math.sin(heading) * i * len / segs });
    const patches = [];
    const np = kind.name === 'ogon' ? 2 : Math.floor(rnd(3, 6));
    for (let i = 0; i < np; i++) {
      patches.push({ seg: Math.floor(rnd(0, 10)), off: rnd(-0.6, 0.6), r: rnd(0.8, 1.5), c: kind.patches[Math.floor(Math.random() * kind.patches.length)] });
    }
    return {
      kind, patches, len, segs, sp: len / segs, pts, heading, speed: rnd(20, 34) * S, phase: rnd(0, TAU),
      mode: 'wander', target: randWater(60 * S), timer: 0, delay: 0, coin: null, bubbleT: 0,
    };
  }
  function widthAt(k, i) {
    const t = i / (k.segs - 1);
    const w = t < 0.22 ? 0.78 + (t / 0.22) * 0.22 : 1 - ((t - 0.22) / 0.78) * 0.86;
    return k.len * 0.125 * w;
  }

  function updateKoi(k, dt) {
    const h = k.pts[0];
    if (k.delay > 0) { k.delay -= dt; }
    let wantSpeed = 28 * S, turn = 1.5;
    if (k.mode === 'chase' && k.delay <= 0) {
      wantSpeed = 120 * S; turn = 3.4;
      k.timer -= dt;
      if (Math.hypot(k.target[0] - h.x, k.target[1] - h.y) < 22 * S || k.timer <= 0) {
        k.mode = 'nibble'; k.timer = rnd(1.4, 2.4);
      }
    } else if (k.mode === 'flee') {
      wantSpeed = 150 * S; turn = 4;
      k.timer -= dt;
      if (Math.hypot(k.target[0] - h.x, k.target[1] - h.y) < 24 * S || k.timer <= 0) { k.mode = 'wander'; k.target = randWater(60 * S); }
    } else if (k.mode === 'nibble') {
      wantSpeed = 22 * S; turn = 2.6;
      k.timer -= dt; k.bubbleT -= dt;
      if (Math.hypot(k.target[0] - h.x, k.target[1] - h.y) < 10 * S) {
        k.target = clampWater(k.coin[0] + rnd(-28, 28) * S, k.coin[1] + rnd(-28, 28) * S, 30 * S);
      }
      if (k.bubbleT <= 0) {
        k.bubbleT = rnd(0.35, 0.7);
        const fx = h.x + Math.cos(k.heading) * 4 * S, fy = h.y + Math.sin(k.heading) * 4 * S;
        addRipple({ x: fx, y: fy, r: 2 * S, max: rnd(16, 26) * S, life: 0.9, a: 0.5, n: 2 });
      }
      if (k.timer <= 0) { k.mode = 'wander'; k.target = randWater(60 * S); }
    } else {
      if (Math.hypot(k.target[0] - h.x, k.target[1] - h.y) < 30 * S || Math.random() < dt * 0.05) k.target = randWater(60 * S);
    }
    if (!inWater(h.x, h.y, 28 * S)) { k.target = [pond.cx + rnd(-40, 40) * S, pond.cy + rnd(-40, 40) * S]; }

    const desired = Math.atan2(k.target[1] - h.y, k.target[0] - h.x);
    const diff = wrap(desired - k.heading);
    k.heading += Math.max(-turn * dt, Math.min(turn * dt, diff));
    k.speed += (wantSpeed - k.speed) * Math.min(1, dt * (k.mode === 'chase' || k.mode === 'flee' ? 3.5 : 1.2));
    k.phase += dt * (3 + k.speed / (12 * S));
    const mv = k.heading + Math.sin(k.phase) * 0.28;
    h.x += Math.cos(mv) * k.speed * dt;
    h.y += Math.sin(mv) * k.speed * dt;
    for (let i = 1; i < k.segs; i++) {
      const a = k.pts[i - 1], b = k.pts[i];
      const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 1;
      b.x = a.x - (dx / d) * k.sp; b.y = a.y - (dy / d) * k.sp;
    }
  }

  function koiPath(k, ox = 0, oy = 0) {
    const L = [], R = [], p = k.pts;
    for (let i = 0; i < k.segs; i++) {
      let ang;
      if (i === 0) ang = Math.atan2(p[0].y - p[1].y, p[0].x - p[1].x);
      else ang = Math.atan2(p[i - 1].y - p[i].y, p[i - 1].x - p[i].x);
      const nx = -Math.sin(ang), ny = Math.cos(ang), w = widthAt(k, i);
      L.push([p[i].x + nx * w + ox, p[i].y + ny * w + oy]);
      R.push([p[i].x - nx * w + ox, p[i].y - ny * w + oy]);
    }
    const fa = Math.atan2(p[0].y - p[1].y, p[0].x - p[1].x), w0 = widthAt(k, 0);
    const path = new Path2D();
    path.moveTo(R[0][0], R[0][1]);
    path.quadraticCurveTo(p[0].x + Math.cos(fa) * w0 * 2.1 + ox, p[0].y + Math.sin(fa) * w0 * 2.1 + oy, L[0][0], L[0][1]);
    for (let i = 1; i < k.segs - 1; i++) path.quadraticCurveTo(L[i][0], L[i][1], (L[i][0] + L[i + 1][0]) / 2, (L[i][1] + L[i + 1][1]) / 2);
    const e = k.segs - 1;
    path.lineTo(L[e][0], L[e][1]);
    path.lineTo(R[e][0], R[e][1]);
    for (let i = e - 1; i > 0; i--) path.quadraticCurveTo(R[i][0], R[i][1], (R[i][0] + R[i - 1][0]) / 2, (R[i][1] + R[i - 1][1]) / 2);
    path.lineTo(R[0][0], R[0][1]);
    path.closePath();
    return path;
  }

  function finsPath(k, ox = 0, oy = 0) {
    const p = k.pts, e = k.segs - 1;
    const path = new Path2D();
    // tail
    const back = Math.atan2(p[e].y - p[e - 1].y, p[e].x - p[e - 1].x) + Math.sin(k.phase - 1.2) * 0.38;
    const tl = k.len * 0.26, tx = p[e].x + ox, ty = p[e].y + oy;
    const t1 = [tx + Math.cos(back - 0.55) * tl, ty + Math.sin(back - 0.55) * tl];
    const t2 = [tx + Math.cos(back + 0.55) * tl, ty + Math.sin(back + 0.55) * tl];
    const notch = [tx + Math.cos(back) * tl * 0.6, ty + Math.sin(back) * tl * 0.6];
    path.moveTo(tx, ty);
    path.quadraticCurveTo(tx + Math.cos(back - 0.3) * tl * 0.7, ty + Math.sin(back - 0.3) * tl * 0.7, t1[0], t1[1]);
    path.quadraticCurveTo(notch[0] + Math.cos(back - 1.2) * 3, notch[1] + Math.sin(back - 1.2) * 3, notch[0], notch[1]);
    path.quadraticCurveTo(notch[0] + Math.cos(back + 1.2) * 3, notch[1] + Math.sin(back + 1.2) * 3, t2[0], t2[1]);
    path.quadraticCurveTo(tx + Math.cos(back + 0.3) * tl * 0.7, ty + Math.sin(back + 0.3) * tl * 0.7, tx, ty);
    // pectoral fins
    const i = 3, ang = Math.atan2(p[i - 1].y - p[i].y, p[i - 1].x - p[i].x), w = widthAt(k, i);
    for (const side of [-1, 1]) {
      const flap = Math.sin(k.phase * 0.8 + (side > 0 ? 0 : 1.4)) * 0.3;
      const fa = ang + Math.PI + side * (1.05 + flap);
      const bx = p[i].x - Math.sin(ang) * w * side * 0.85 + ox, by = p[i].y + Math.cos(ang) * w * side * 0.85 + oy;
      const fl = k.len * 0.13;
      path.moveTo(bx, by);
      path.ellipse(bx + Math.cos(fa) * fl * 0.5, by + Math.sin(fa) * fl * 0.5, fl * 0.55, fl * 0.24, fa, 0, TAU);
    }
    return path;
  }

  function drawKoiShadow(k) {
    const off = 9 * S;
    ctx.fillStyle = 'rgba(4,18,22,0.12)';
    ctx.fill(koiPath(k, off * 1.3, off * 1.75));
    ctx.fillStyle = 'rgba(4,18,22,0.2)';
    ctx.fill(koiPath(k, off, off * 1.4));
    ctx.fill(finsPath(k, off, off * 1.4));
  }
  function drawKoi(k) {
    const kind = k.kind;
    ctx.fillStyle = kind.fin;
    ctx.fill(finsPath(k));
    const body = koiPath(k);
    ctx.fillStyle = kind.base;
    ctx.fill(body);
    ctx.save();
    ctx.clip(body);
    const p = k.pts;
    for (const pt of k.patches) {
      const i = Math.min(pt.seg, k.segs - 2);
      const ang = Math.atan2(p[i].y - p[i + 1].y, p[i].x - p[i + 1].x), w = widthAt(k, i);
      const x = p[i].x - Math.sin(ang) * w * pt.off, y = p[i].y + Math.cos(ang) * w * pt.off;
      ctx.fillStyle = pt.c;
      ctx.beginPath();
      ctx.ellipse(x, y, widthAt(k, 2) * pt.r, widthAt(k, 2) * pt.r * 0.8, ang, 0, TAU);
      ctx.fill();
    }
    // rounded flanks and a wet dorsal sheen
    ctx.strokeStyle = 'rgba(25,14,8,0.28)';
    ctx.lineWidth = widthAt(k, 3) * 0.9;
    ctx.stroke(body);
    ctx.strokeStyle = 'rgba(255,255,245,0.26)';
    ctx.lineWidth = 2.4 * S;
    ctx.beginPath();
    ctx.moveTo(p[1].x, p[1].y);
    for (let i = 2; i < k.segs - 2; i++) ctx.lineTo(p[i].x, p[i].y);
    ctx.stroke();
    ctx.restore();
    // eyes
    const fa = Math.atan2(p[0].y - p[1].y, p[0].x - p[1].x), w0 = widthAt(k, 0);
    ctx.fillStyle = '#121212';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(p[0].x + Math.cos(fa) * w0 * 0.55 - Math.sin(fa) * w0 * 0.62 * s, p[0].y + Math.sin(fa) * w0 * 0.55 + Math.cos(fa) * w0 * 0.62 * s, 1.5 * S, 0, TAU);
      ctx.fill();
    }
  }

  /* ---------- coins ---------- */
  function drawCoin(x, y, r, spin, alpha = 1) {
    // 方孔铜钱: round coin, square hole
    const sx = Math.max(0.12, Math.abs(Math.cos(spin)));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.scale(sx, 1);
    const g = ctx.createLinearGradient(-r, -r, r, r);
    g.addColorStop(0, '#f6d27a'); g.addColorStop(0.5, '#d29a3a'); g.addColorStop(1, '#8e5f1e');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(90,55,15,0.75)'; ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.beginPath(); ctx.arc(0, 0, r * 0.84, 0, TAU); ctx.stroke();
    const hs = r * 0.3;
    ctx.fillStyle = 'rgba(30,20,8,0.85)';
    ctx.fillRect(-hs, -hs, hs * 2, hs * 2);
    ctx.restore();
  }

  // from: release point of a flick; keyboard tosses start below the screen
  function toss(tx, ty, from) {
    [tx, ty] = clampWater(tx, ty, 18 * S);
    const sx = from ? from[0] : W / 2 + (tx - W / 2) * 0.35 + rnd(-20, 20);
    const sy = from ? from[1] : toWorldY(H + 30);
    const dist = Math.hypot(tx - sx, ty - sy);
    flying.push({ sx, sy, tx, ty, t: 0, dur: 0.6 + dist / 1800, arc: 90 * S + dist * 0.28, spin: rnd(0, TAU) });
    if (!hint.classList.contains('gone')) hint.classList.add('gone');
  }

  function land(f) {
    const { tx: x, ty: y } = f;
    const bd = Math.hypot(x - bowl.x, y - bowl.y);
    const hit = bd < bowl.R * 0.92;
    let dx = rnd(-6, 6) * S, dy = rnd(-6, 6) * S;
    if (hit) {
      const a = rnd(0, TAU), r = Math.sqrt(Math.random()) * bowl.R * 0.5;
      dx = bowl.x + Math.cos(a) * r - x; dy = bowl.y + Math.sin(a) * r - y;
    }
    coins.push({ x, y, rot: rnd(0, TAU), age: 0, dx, dy });
    if (coins.length > 240) coins.shift();
    addRipple({ x, y, r: 3 * S, max: 140 * S, life: 1, a: 0.8, n: 7, big: true });
    addRipple({ x, y, r: 2 * S, max: 70 * S, life: 0.8, a: 0.5, n: 4, delay: 0.35 });
    pushBlossoms(x, y, 60 * S);
    for (let i = 0; i < 16; i++) {
      const a = rnd(0, TAU), v = rnd(30, 110) * S;
      drops.push({ x, y, z: 0, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.8, vz: rnd(90, 220) * S, r: rnd(1.2, 2.8) * S });
    }
    glows.push({ x, y, life: 1, big: hit });
    count++;
    nEl.textContent = count;
    store.set('count', count);
    if (hit) {
      hits++;
      hitsEl.textContent = hits;
      store.set('hits', hits);
      glows.push({ x: bowl.x, y: bowl.y, life: 1.6, big: true });
      floats.push({ text: '投中了', x: bowl.x, y: bowl.y - bowl.R - 10 * S, life: 1.8, size: 22, color: '255,214,120' });
      setTimeout(openWish, 900);
    } else if (bd < bowl.R * 2) {
      floats.push({ text: '差一点', x, y: y - 24 * S, life: 1.3, size: 15, color: '243,234,214' });
    }
    // koi notice
    const reach = Math.max(pond.rx, pond.ry) * 1.1;
    for (const k of koi) {
      const d = Math.hypot(k.pts[0].x - x, k.pts[0].y - y);
      if (d < reach && Math.random() < 0.9) {
        k.mode = 'chase';
        k.coin = [x, y];
        k.target = clampWater(x + rnd(-14, 14) * S, y + rnd(-14, 14) * S, 30 * S);
        k.delay = 0.12 + d / (700 * S) + rnd(0, 0.25);
        k.timer = 5;
      }
    }
  }

  /* ---------- F0 touch water ---------- */
  function touchWater(x, y) {
    if (!inWater(x, y)) return;
    addRipple({ x, y, r: 2 * S, max: 95 * S, life: 1, a: 0.7, n: 5, big: true });
    pushBlossoms(x, y, 40 * S);
    for (const k of koi) {
      const h = k.pts[0], d = Math.hypot(h.x - x, h.y - y);
      if (d > 150 * S) continue;
      const a = Math.atan2(h.y - y, h.x - x);
      k.mode = 'flee'; k.delay = 0; k.timer = rnd(1.6, 2.6);
      k.target = clampWater(h.x + Math.cos(a) * 180 * S, h.y + Math.sin(a) * 180 * S, 40 * S);
    }
  }

  /* ---------- F2 wishes and lanterns ---------- */
  function launchLantern(text) {
    lanterns.push({ x: bowl.x, y: bowl.y, a: rnd(0, TAU), v: 16 * S, text, age: 0, ph: rnd(0, TAU), label: 4, wake: 0 });
    if (lanterns.length > 12) lanterns.shift();
  }
  function lanternAt(x, y) {
    for (let i = lanterns.length - 1; i >= 0; i--) if (Math.hypot(lanterns[i].x - x, lanterns[i].y - y) < 24 * S) return lanterns[i];
    return null;
  }
  let hovered = null, labels = [];
  function drawLanterns(dt) {
    for (let i = lanterns.length - 1; i >= 0; i--) {
      const l = lanterns[i];
      l.age += dt; l.label -= dt; l.wake -= dt;
      if (l.age > 22) { lanterns.splice(i, 1); continue; }
      if (!inWater(l.x, l.y, 36 * S)) l.v *= Math.pow(0.4, dt);
      l.a += Math.sin(l.age * 0.4 + l.ph) * 0.15 * dt;
      l.x += Math.cos(l.a) * l.v * dt; l.y += Math.sin(l.a) * l.v * dt;
      if (l.wake <= 0 && l.v > 4 * S) { l.wake = 1.4; addRipple({ x: l.x, y: l.y, r: 10 * S, max: 32 * S, life: 0.8, a: 0.35, n: 2 }); }
      const alpha = Math.min(1, l.age / 0.8) * (l.age > 20 ? 1 - (l.age - 20) / 2 : 1);
      const flick = 0.85 + Math.sin(tNow * 13 + l.ph) * 0.08 + Math.sin(tNow * 7.3) * 0.07;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, 54 * S);
      gr.addColorStop(0, `rgba(255,190,100,${0.4 * flick})`); gr.addColorStop(1, 'rgba(255,190,100,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(l.x, l.y, 54 * S, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      const rot = l.age * 0.15 + l.ph;
      for (const [n, pr, col] of [[8, 15, '#d9455f'], [6, 10, '#f3a0b0']]) {
        ctx.fillStyle = col;
        for (let j = 0; j < n; j++) {
          const a = rot + j / n * TAU + (n === 6 ? 0.3 : 0);
          ctx.beginPath(); ctx.ellipse(l.x + Math.cos(a) * pr * 0.55 * S, l.y + Math.sin(a) * pr * 0.55 * S, pr * 0.6 * S, pr * 0.28 * S, a, 0, TAU); ctx.fill();
        }
      }
      ctx.fillStyle = `rgba(255,243,196,${flick})`;
      ctx.beginPath(); ctx.arc(l.x, l.y, 4 * S, 0, TAU); ctx.fill();
      if (l.label > 0 || l === hovered) labels.push([l.text, l.x, l.y - 26 * S, alpha * Math.min(1, l === hovered ? 1 : l.label / 0.6)]);
      ctx.restore();
    }
  }
  function drawLabel(text, wx, wy, a) {
    const [x, y] = toScreen(wx, wy);
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.font = '14px "Noto Sans SC", "PingFang SC", sans-serif';
    const w = Math.min(ctx.measureText(text).width, W - 40) + 20, h = 28;
    const bx = Math.max(10, Math.min(W - w - 10, x - w / 2));
    ctx.fillStyle = 'rgba(10,24,26,0.78)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, y - h, w, h, 14) : ctx.rect(bx, y - h, w, h); ctx.fill();
    ctx.fillStyle = '#f3ead6'; ctx.textBaseline = 'middle';
    ctx.fillText(text, bx + 10, y - h / 2 + 1, w - 20);
    ctx.restore();
  }
  function drawFloats(dt) {
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt; f.y -= 18 * S * dt;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.min(1, f.life / 0.5);
      ctx.font = `${f.size}px "ZCOOL XiaoWei", "STKaiti", serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 8;
      ctx.fillStyle = `rgb(${f.color})`;
      const [fx, fy] = toScreen(f.x, f.y);
      ctx.fillText(f.text, fx, fy);
      ctx.restore();
    }
  }

  function openWish() {
    wishForm.hidden = false;
    hint.classList.add('gone');
    wishInput.value = ''; wishLen.textContent = '0 / 40';
    try { wishInput.focus({ preventScroll: true }); } catch (e) {}
  }
  function closeWish() { wishForm.hidden = true; cv.focus({ preventScroll: true }); }
  wishInput.addEventListener('input', () => { wishLen.textContent = `${wishInput.value.length} / 40`; });
  wishForm.addEventListener('submit', e => {
    e.preventDefault();
    const text = wishInput.value.trim().slice(0, 40);
    if (!text) { wishInput.placeholder = '写一句再放灯吧'; wishInput.focus(); return; }
    launchLantern(text);
    const list = store.get('wishes', []);
    list.unshift({ text, t: Date.now() });
    store.set('wishes', list.slice(0, 20));
    closeWish();
  });
  document.getElementById('wishSkip').addEventListener('click', closeWish);

  function renderWishes() {
    const list = store.get('wishes', []);
    wishList.replaceChildren();
    if (!list.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '还没有愿望。把铜钱投进池心的石碗，就能写下一个。';
      wishList.append(li);
      return;
    }
    for (const w of list) {
      const li = document.createElement('li');
      const t = document.createElement('time');
      const d = new Date(w.t);
      t.dateTime = d.toISOString();
      t.textContent = `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      li.append(document.createTextNode(w.text), t);
      wishList.append(li);
    }
  }
  wishesBtn.addEventListener('click', () => { renderWishes(); wishesEl.hidden = !wishesEl.hidden; });
  document.getElementById('wishesClose').addEventListener('click', () => { wishesEl.hidden = true; });

  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove('gone');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.add('gone'), 1800);
  }

  /* ---------- layout ---------- */
  function layout() {
    const old = { ...pond };
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const portrait = H > W * 1.05;
    view.T = portrait ? 0.78 : 0.58;
    view.top = Math.round(H * (portrait ? 0.3 : 0.34));
    view.sc = Math.max(0.6, Math.min(1.3, Math.min(W, H) / 700));
    view.rim = 14 * view.sc; view.path = 24 * view.sc;
    const side = Math.max(22, W * 0.05) + view.rim + view.path * 0.5;
    const fore = Math.max(70, H * 0.12);
    const rx = Math.min(W / 2 - side, H);
    const avail = H - view.top - fore - view.rim * 2 - view.path - 40 * view.sc;
    const sry = Math.max(60, Math.min(rx * (portrait ? 0.95 : 0.52), avail / 2));
    pond.cx = W / 2; pond.rx = rx;
    pond.cy = H - fore - sry - view.rim;
    pond.ry = sry / view.T;
    view.wallH = 4 + sry * 0.06;
    S = Math.max(0.55, Math.min(1.25, Math.min(pond.rx, pond.ry) / 260));
    bowl.x = pond.cx; bowl.y = pond.cy; bowl.R = Math.max(30, Math.min(pond.rx, pond.ry) * 0.17);
    if (!koi.length) {
      buildScenery();
      setupWater();
      makeLilies();
      makeBlossoms();
      for (const kd of KINDS) koi.push(makeKoi(kd));
    } else {
      const mx = v => pond.cx + (v - old.cx) * pond.rx / old.rx;
      const my = v => pond.cy + (v - old.cy) * pond.ry / old.ry;
      for (const k of koi) { for (const p of k.pts) { p.x = mx(p.x); p.y = my(p.y); } k.target = randWater(60 * S); k.mode = 'wander'; }
      for (const c of coins) { c.x = mx(c.x); c.y = my(c.y); }
      for (const l of lilies) { l.x = mx(l.x); l.y = my(l.y); }
      for (const l of lanterns) { l.x = mx(l.x); l.y = my(l.y); }
      for (const b of blossoms) { b.x = mx(b.x); b.y = my(b.y); }
      ripples = []; drops = []; flying = []; glows = [];
      buildScenery();
      setupWater();
    }
  }

  /* ---------- draw ---------- */
  let tNow = 0;
  function waterClip() {
    ctx.beginPath();
    ctx.ellipse(pond.cx, pond.cy, pond.rx, pond.ry, 0, 0, TAU);
    ctx.clip();
  }
  function drawWater() {
    const r = Math.max(pond.rx, pond.ry);
    const g = ctx.createRadialGradient(pond.cx - pond.rx * 0.2, pond.cy + pond.ry * 0.25, r * 0.05, pond.cx, pond.cy, r);
    g.addColorStop(0, '#5cbf72'); g.addColorStop(0.6, '#23804e'); g.addColorStop(1, '#0d3d27');
    ctx.fillStyle = g;
    ctx.fillRect(pond.cx - pond.rx, pond.cy - pond.ry, pond.rx * 2, pond.ry * 2);
    // far side is darker: the basin wall and the trees reflect there
    const fg = ctx.createLinearGradient(0, pond.cy - pond.ry, 0, pond.cy + pond.ry * 0.2);
    fg.addColorStop(0, 'rgba(6,30,14,0.7)'); fg.addColorStop(1, 'rgba(6,30,14,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(pond.cx - pond.rx, pond.cy - pond.ry, pond.rx * 2, pond.ry * 1.2);
    for (const p of pebbles) {
      ctx.fillStyle = `rgba(${p.c},${p.a})`;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 0.7, p.rot, 0, TAU); ctx.fill();
      if (p.moss) {
        ctx.fillStyle = 'rgba(150,200,90,0.12)';
        ctx.beginPath(); ctx.ellipse(p.x - p.r * 0.2, p.y - p.r * 0.2, p.r * 0.6, p.r * 0.4, p.rot, 0, TAU); ctx.fill();
      }
    }
  }
  function drawBowl() {
    // carved stone bowl on the bed, lit from the upper left
    const { x, y, R } = bowl;
    ctx.fillStyle = 'rgba(0,12,8,0.3)';
    ctx.beginPath(); ctx.arc(x + 7 * S, y + 10 * S, R * 1.18, 0, TAU); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.4, y - R * 0.45, R * 0.1, x, y, R * 1.15);
    g.addColorStop(0, '#d6d0b2'); g.addColorStop(0.55, '#8f8d74'); g.addColorStop(1, '#4a4c3b');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, R * 1.12, 0, TAU); ctx.fill();
    const g2 = ctx.createRadialGradient(x + R * 0.15, y + R * 0.2, 0, x, y, R * 0.86);
    g2.addColorStop(0, '#9a915e'); g2.addColorStop(0.7, '#655f3f'); g2.addColorStop(1, '#2c2d20');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(x, y, R * 0.84, 0, TAU); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, R * 0.84, 0, TAU); ctx.clip();
    ctx.strokeStyle = 'rgba(12,16,8,0.45)'; ctx.lineWidth = R * 0.28;
    ctx.beginPath(); ctx.arc(x - R * 0.12, y - R * 0.15, R * 0.92, 0, TAU); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,235,0.4)'; ctx.lineWidth = 1.5 * S;
    ctx.beginPath(); ctx.arc(x, y, R * 1.08, Math.PI * 1.0, Math.PI * 1.65); ctx.stroke();
    ctx.fillStyle = 'rgba(110,140,60,0.45)';
    for (let i = 0; i < 5; i++) {
      const a = 0.6 + i * 1.1;
      ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * R * 0.98, y + Math.sin(a) * R * 0.98, R * 0.16, R * 0.08, a + Math.PI / 2, 0, TAU); ctx.fill();
    }
    ctx.save();
    ctx.font = `${Math.round(R * 0.9)}px "ZCOOL XiaoWei", "STKaiti", serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(25,22,10,0.4)';
    ctx.fillText('愿', x - 1, y + R * 0.04 - 1);
    ctx.globalAlpha = 0.3 + Math.sin(tNow * 1.2) * 0.06;
    ctx.fillStyle = '#f0dfa8';
    ctx.fillText('愿', x, y + R * 0.04);
    ctx.restore();
  }
  function drawSunkCoins(dt) {
    for (const c of coins) {
      c.age += dt;
      const s = Math.min(1, c.age / 1.4);
      const e = 1 - Math.pow(1 - s, 3);
      const x = c.x + c.dx * e + Math.sin(c.age * 3) * (1 - s) * 3 * S, y = c.y + c.dy * e;
      drawCoin(x, y, 8.5 * S * (1 - 0.22 * e), c.rot * (1 - e) + (s >= 1 ? 0 : c.age * 4), 0.95 - 0.4 * e);
    }
  }
  // F-art: caustic light net, computed at low resolution and scaled up
  let cc = null, cctx = null, cimg = null, cAcc = 1;
  function causticsSetup() {
    const cw = Math.max(8, Math.ceil(pond.rx * 2 / 5)), ch = Math.max(8, Math.ceil(pond.ry * 2 / 5));
    cc = document.createElement('canvas'); cc.width = cw; cc.height = ch;
    cctx = cc.getContext('2d'); cimg = cctx.createImageData(cw, ch); cAcc = 1;
  }
  function drawCaustics(dt) {
    cAcc += dt;
    if (cAcc > 1 / 30) {
      cAcc = 0;
      const cw = cc.width, ch = cc.height, d = cimg.data, t = tNow * 0.8;
      let p = 0;
      for (let j = 0; j < ch; j++) {
        const y = j * 5;
        for (let i = 0; i < cw; i++) {
          const x = i * 5;
          const u = x * 0.018 + Math.sin(y * 0.013 + t * 0.7) * 1.4;
          const v = y * 0.02 + Math.sin(x * 0.011 - t * 0.6) * 1.4;
          const n = Math.sin(u + t * 0.5) + Math.sin(v - t * 0.4) + Math.sin((u - v) * 0.8 + t * 0.3);
          const c = Math.pow(1 - Math.abs(Math.sin(n * 1.5)), 5);
          d[p++] = 236; d[p++] = 255; d[p++] = 205; d[p++] = c * 255;

    water.bx = pond.cx - pond.rx; water.by = pond.cy - pond.ry * T;
    water.bw = pond.rx * 2; water.bh = pond.ry * 2 * T;
    const pw = Math.max(2, Math.round(water.bw * water.gD)), ph = Math.max(2, Math.round(water.bh * water.gD));
    gcv.width = pw; gcv.height = ph;
    Object.assign(gcv.style, { left: water.bx + 'px', top: water.by + 'px', width: water.bw + 'px', height: water.bh + 'px' });
    bgEl.width = cv.width; bgEl.height = cv.height;
    bgEl.getContext('2d').drawImage(bgC, 0, 0);
    if (!water.underC) water.underC = document.createElement('canvas');
    water.underC.width = pw; water.underC.height = ph;
    water.uctx = water.underC.getContext('2d');
    water.floorC = paintFloor();
    // wave grid, square cells in world units
    water.cell = Math.max(2.6, pond.rx * 2 / 170);
    water.nx = Math.ceil(pond.rx * 2 / water.cell) + 1;
    water.ny = Math.ceil(pond.ry * 2 / water.cell) + 1;
    const n = water.nx * water.ny;
    water.h = new Float32Array(n); water.p = new Float32Array(n); water.mask = new Uint8Array(n);
    water.px = new Uint8Array(n * 4);
    for (let j = 0; j < water.ny; j++) for (let i = 0; i < water.nx; i++) {
      const x = pond.cx - pond.rx + i * water.cell, y = pond.cy - pond.ry + j * water.cell;
      water.mask[j * water.nx + i] = inWater(x, y, water.cell) ? 1 : 0;

    water.pend = [];
    gl.viewport(0, 0, pw, ph);
    // the ruins above the pond, for the reflection
    const rc = document.createElement('canvas');
    rc.width = Math.max(2, Math.round(W / 2)); rc.height = Math.max(2, Math.round(H / 2));
    const rg = rc.getContext('2d');
    rg.drawImage(bgC, 0, 0, rc.width, rc.height);
    rg.drawImage(rimC, 0, 0, rc.width, rc.height);
    gl.activeTexture(gl.TEXTURE2);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, rc);

  function waveDrop(x, y, rad, amp) {
    if (!water.h) return;
    const c = water.cell, gx = (x - pond.cx + pond.rx) / c, gy = (y - pond.cy + pond.ry) / c;
    const r = Math.max(1.4, rad / c), R = Math.ceil(r * 2.5);
    for (let j = Math.max(1, Math.floor(gy - R)); j <= Math.min(water.ny - 2, Math.ceil(gy + R)); j++) {
      for (let i = Math.max(1, Math.floor(gx - R)); i <= Math.min(water.nx - 2, Math.ceil(gx + R)); i++) {
        const k = j * water.nx + i;
        if (!water.mask[k]) continue;
        const d2 = ((i - gx) ** 2 + (j - gy) ** 2) / (r * r);
        water.h[k] -= amp * Math.exp(-d2);

  }
  function waveAt(x, y) {
    if (!water.h) return 0;
    const i = Math.round((x - pond.cx + pond.rx) / water.cell), j = Math.round((y - pond.cy + pond.ry) / water.cell);
    if (i < 0 || j < 0 || i >= water.nx || j >= water.ny) return 0;
    return water.h[j * water.nx + i];
  }
  // every ripple in the game goes through here: real waves with WebGL, drawn rings in the 2D fallback
  function addRipple(r) {
    if (!gl) { ripples.push(r); return; }
    const amp = (r.a || 0.5) * (r.big ? 3.4 : 1.5), rad = Math.max(3 * S, Math.min(9 * S, r.max * 0.065));
    const t0 = r.delay || 0;

    if (r.big) {

  function stepWaves() {
    const { nx, ny, mask } = water;

    for (let j = 1; j < ny - 1; j++) {

  function packWaves() {

    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx; i++) {

  // static lake bed, painted in world units: silt, sand grain, shaded pebbles, mossy stones, leaves, weed
  function noiseCanvas(n, a) {
    const c = document.createElement('canvas'); c.width = c.height = n;
    const g = c.getContext('2d'), im = g.createImageData(n, n), d = im.data;
    for (let i = 0; i < d.length; i += 4) { const v = Math.random() < 0.5 ? 0 : 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = Math.random() * a; }
    g.putImageData(im, 0, 0);
    return c;
  }
  const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const tone = (c, f, a = 1) => `rgba(${c.map(v => Math.max(0, Math.min(255, Math.round(v * f)))).join(',')},${a})`;
  function stone(g, x, y, r, rot, hex, moss) {
    const c = hexRGB(hex), ry = r * 0.72;
    g.fillStyle = 'rgba(18,24,10,0.32)';
    g.beginPath(); g.ellipse(x + r * 0.22, y + r * 0.3, r * 1.08, ry * 1.1, rot, 0, TAU); g.fill();
    const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.05, x, y, r * 1.1);
    gr.addColorStop(0, tone(c, 1.3)); gr.addColorStop(0.55, tone(c, 1)); gr.addColorStop(1, tone(c, 0.55));
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(x, y, r, ry, rot, 0, TAU); g.fill();
    if (moss) {
      const mg = g.createRadialGradient(x - r * 0.2, y - r * 0.25, 0, x - r * 0.1, y - r * 0.15, r * 0.9);
      mg.addColorStop(0, 'rgba(118,140,60,0.6)'); mg.addColorStop(0.6, 'rgba(84,108,44,0.4)'); mg.addColorStop(1, 'rgba(84,108,44,0)');

      g.beginPath(); g.ellipse(x - r * 0.1, y - r * 0.15, r * 0.9, ry * 0.85, rot, 0, TAU); g.fill();
      for (let i = 0; i < r / 2; i++) {
        g.fillStyle = Math.random() < 0.5 ? 'rgba(160,190,80,0.35)' : 'rgba(50,80,30,0.3)';
        g.beginPath(); g.arc(x + rnd(-0.6, 0.5) * r, y + rnd(-0.5, 0.4) * ry, rnd(0.6, 1.6) * S, 0, TAU); g.fill();

  function paintFloor() {
    const fd = water.gD;
    const c = document.createElement('canvas');
    c.width = Math.round(pond.rx * 2 * fd); c.height = Math.round(pond.ry * 2 * fd);
    const g = c.getContext('2d');
    g.setTransform(fd, 0, 0, fd, -(pond.cx - pond.rx) * fd, -(pond.cy - pond.ry) * fd);
    const { cx, cy, rx, ry } = pond;
    g.save(); g.translate(cx, cy); g.scale(1, ry / rx);
    let gr = g.createRadialGradient(-rx * 0.12, rx * 0.1, 0, 0, 0, rx);
    gr.addColorStop(0, '#c4b06c'); gr.addColorStop(0.5, '#a0904f'); gr.addColorStop(0.82, '#66703a'); gr.addColorStop(1, '#2c3a20');
    g.fillStyle = gr; g.fillRect(-rx, -rx, rx * 2, rx * 2);
    g.restore();
    // silt tones and sand grain
    for (let i = 0; i < 60; i++) {
      const [x, y] = randWater(0);
      g.fillStyle = Math.random() < 0.5 ? 'rgba(70,90,40,0.12)' : 'rgba(210,195,140,0.1)';
      g.beginPath(); g.ellipse(x, y, rnd(30, 90) * S, rnd(20, 60) * S, rnd(0, TAU), 0, TAU); g.fill();
    }

    const items = [];
    for (let i = 0; i < 520; i++) {
      // pebbles gather toward the rim, where the bed slopes up
      const a = rnd(0, TAU), rr = Math.pow(Math.random(), 0.45) * 0.97;
      const x = cx + Math.cos(a) * rx * rr, y = cy + Math.sin(a) * ry * rr;
      items.push({ x, y, r: Math.pow(Math.random(), 2) * 7 * S * (0.7 + rr * 0.6) + 1.2 * S, hex: pal[(Math.random() * pal.length) | 0], moss: false });
    }
    for (let i = 0; i < 16; i++) {
      const a = rnd(0, TAU), rr = rnd(0.35, 0.95);
      items.push({ x: cx + Math.cos(a) * rx * rr, y: cy + Math.sin(a) * ry * rr, r: rnd(14, 34) * S, hex: Math.random() < 0.5 ? '#6f7360' : '#7c7a64', moss: true });
    }
    for (let i = 0; i < 70; i++) {
      const a = rnd(0, TAU), rr = rnd(0.86, 1.02);
      items.push({ x: cx + Math.cos(a) * rx * rr, y: cy + Math.sin(a) * ry * rr, r: rnd(12, 26) * S, hex: Math.random() < 0.6 ? '#5f6552' : '#76735d', moss: Math.random() < 0.7 });
    }
    items.sort((p, q) => p.y - q.y);
    for (const it of items) stone(g, it.x, it.y, it.r, rnd(-0.6, 0.6), it.hex, it.moss);
    // sunken leaves
    for (let i = 0; i < 18; i++) {
      const [x, y] = randWater(20 * S), l = rnd(7, 13) * S, a = rnd(0, TAU);
      g.fillStyle = ['rgba(150,104,40,0.75)', 'rgba(120,90,40,0.7)', 'rgba(170,140,60,0.7)'][i % 3];
      g.beginPath(); g.ellipse(x, y, l, l * 0.38, a, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(70,45,15,0.5)'; g.lineWidth = 0.7;
      g.beginPath(); g.moveTo(x - Math.cos(a) * l, y - Math.sin(a) * l); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }

    for (let i = 0; i < 40; i++) {
      const a = rnd(0, TAU), rr = rnd(0.78, 0.95), x = cx + Math.cos(a) * rx * rr, y = cy + Math.sin(a) * ry * rr;
      for (let k = 0; k < 7; k++) {
        const ang = Math.atan2(cy - y, cx - x) + rnd(-0.7, 0.7), len = rnd(10, 26) * S;
        g.strokeStyle = Math.random() < 0.5 ? 'rgba(60,100,35,0.55)' : 'rgba(95,135,50,0.45)';

    g.fillStyle = gr; g.fillRect(-rx, -rx, rx * 2, rx * 2);
    g.restore();
    return c;
  }

  function drawLilyShadows() {
    ctx.fillStyle = 'rgba(8,22,10,0.26)';
    const ox = 12 * S, oy = 18 * S;
    for (const l of lilies) {
      const rot = l.rot + Math.sin(tNow * 0.4 + l.ph) * 0.06;
      const bx = l.x + Math.sin(tNow * 0.3 + l.ph) * 2 * S + ox, by = l.y + Math.cos(tNow * 0.25 + l.ph) * 2 * S + oy;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.arc(bx, by, l.r * 1.05, rot + 0.28, rot + TAU - 0.28); ctx.closePath(); ctx.fill();
    }
    for (const b of blossoms) { ctx.beginPath(); ctx.arc(b.x + ox, b.y + oy, b.r * 0.9, 0, TAU); ctx.fill(); }
  }

  function renderWater(dt) {
    const T = view.T, gD = water.gD, u = water.uctx;
    // what lies under the surface
    const saved = ctx;
    ctx = u;
    u.setTransform(gD, 0, 0, gD * T, -water.bx * gD, gD * (pond.cy * (1 - T) - water.by));
    u.drawImage(water.floorC, pond.cx - pond.rx, pond.cy - pond.ry, pond.rx * 2, pond.ry * 2);

    drawLilyShadows();
    for (const k of koi) drawKoiShadow(k);
    u.fillStyle = 'rgba(30,96,72,0.08)';
    u.fillRect(pond.cx - pond.rx, pond.cy - pond.ry, pond.rx * 2, pond.ry * 2);

    gl.uniform4f(tex.uWorld, pond.cx - pond.rx, pond.cy - pond.ry, pond.rx * 2, pond.ry * 2);
    gl.uniform2f(tex.uScreen, W, H);

  let last = performance.now();
  function frame(now) {

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (gl) ctx.clearRect(0, 0, W, H); else ctx.drawImage(bgC, 0, 0, W, H);

      drawBlossoms(dt);
    } else {

      waterClip();
      drawWater();
      drawBowl();
      drawSunkCoins(dt);
      for (const k of koi) drawKoiShadow(k);
      for (const k of koi) drawKoi(k);
      ctx.fillStyle = 'rgba(40,130,80,0.1)';
      ctx.fillRect(pond.cx - pond.rx, pond.cy - pond.ry, pond.rx * 2, pond.ry * 2);

      drawGlows(dt);
      drawLilies();

      drawBlossoms(dt);

    }
    ctx.drawImage(rimC, 0, 0, W, H);
    drawWaterfall(dt);
    ctx.drawImage(fgC, 0, 0, W, H);

    drawAim(now);
    drawFlying(dt);
    drawDrops(dt);
    drawFloats(dt);
    drawSunlight(dt);
    requestAnimationFrame(frame);

  /* ---------- F0 input: tap touches the water, hold and flick upward tosses ---------- */
  const ptr = { down: false, id: null, holding: false, x0: 0, y0: 0, t0: 0, x: 0, y: 0, samples: [] };
  const HOLD_MS = 180, TAP_PX = 10;
  // pointer positions are converted to world units
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, toWorldY(e.clientY - r.top)]; };
  function velocity() {
    const s = ptr.samples, now = performance.now();

    const a = recent[0], b = recent[recent.length - 1], dt = (b.t - a.t) / 1000;

    if (isFlick(v)) {

      ctx.save();

      ctx.strokeStyle = 'rgba(255,214,120,0.75)'; ctx.lineWidth = 1.5;

      ctx.beginPath(); ctx.ellipse(ax, ay, 12 * S, 12 * S * view.T, 0, 0, TAU); ctx.stroke();

    }
    const [hx, hy] = toScreen(ptr.x, ptr.y);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(hx + 5, hy + 9, 11 * S, 6 * S, 0, 0, TAU); ctx.fill();
    drawCoin(hx, hy - 6 * S, 12 * S, Math.sin(now / 300) * 0.4);
  }
  cv.addEventListener('pointerdown', e => {
    if (ptr.down) return;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    const [x, y] = pos(e), t = performance.now();
    Object.assign(ptr, { down: true, id: e.pointerId, holding: false, x0: x, y0: y, t0: t, x, y, samples: [{ x, y, t }] });
    cv.style.cursor = 'grabbing';

  cv.addEventListener('pointermove', e => {
    const [x, y] = pos(e);
    if (!ptr.down || e.pointerId !== ptr.id) {
      if (e.pointerType === 'mouse') { hovered = lanternAt(x, y); cv.style.cursor = hovered ? 'pointer' : 'grab'; }
      return;
    }
    const t = performance.now();
    ptr.x = x; ptr.y = y;
    ptr.samples.push({ x, y, t });
    if (ptr.samples.length > 30) ptr.samples.shift();

  });

    const [x, y] = pos(e), t = performance.now();
    ptr.x = x; ptr.y = y; ptr.samples.push({ x, y, t });
    ptr.down = false;
    cv.style.cursor = 'grab';
    if (!ptr.holding && t - ptr.t0 < 400) {
      const l = lanternAt(x, y);
      if (l) l.label = 3; else touchWater(x, y);
      return;
    }
    const v = velocity();
    if (isFlick(v)) {
      toss(x + v[0] * reach(), y + v[1] * reach(), [x, y]);
    } else {

    }
  });
  cv.addEventListener('pointercancel', () => { ptr.down = false; ptr.holding = false; cv.style.cursor = 'grab'; });
  window.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!wishForm.hidden) closeWish();
    if (!wishesEl.hidden) wishesEl.hidden = true;
